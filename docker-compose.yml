services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    volumes:
      - seq-data:/data
    ports:
      - "${SEQ_HTTP_PORT}:80"

  migrator:
    build:
      context: .
      dockerfile: src/TuttiWallet.Migrator/Dockerfile
    environment:
      CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/TuttiWallet.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Cors__AllowedOrigins__0: http://localhost:${WEB_HTTP_PORT}
      Jwt__Chave: ${JWT_CHAVE}
      Seq__Url: http://seq:80
    ports:
      - "${API_HTTP_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      seq:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: src/TuttiWallet.Web/Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://localhost:${API_HTTP_PORT}
    ports:
      - "${WEB_HTTP_PORT}:80"
    depends_on:
      - api

volumes:
  postgres-data:
  seq-data:
