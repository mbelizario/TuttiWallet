name: CI

on:
  pull_request:
    branches:
      - main
      - preprod

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore TuttiWallet.slnx

      - name: Build
        run: dotnet build TuttiWallet.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test TuttiWallet.slnx --no-build --configuration Release
