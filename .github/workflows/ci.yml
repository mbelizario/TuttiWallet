name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - preprod

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore TuttiWallet.slnx

      - name: Verificar formatação
        run: dotnet format TuttiWallet.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build TuttiWallet.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test TuttiWallet.slnx --no-build --configuration Release

  validar-scripts-migracao:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar scripts de migração
        env:
          BASE_REF: ${{ github.base_ref }}
          LIBERADO: ${{ contains(github.event.pull_request.labels.*.name, 'editar-script-aplicado') }}
        run: bash .github/scripts/validar-scripts-migracao.sh
